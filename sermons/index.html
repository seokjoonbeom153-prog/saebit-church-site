<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16324f" />
    <title>설교 게시판 | 새빛교회</title>
    <meta
      name="description"
      content="기독교대한감리회 새빛교회 주일예배 설교 영상 게시판"
    />
    <link rel="icon" href="../app-icon.svg" type="image/svg+xml" />
    <style>
      :root {
        --navy: #16324f;
        --blue: #234e70;
        --gold: #c7a56a;
        --ink: #1f2933;
        --muted: #64748b;
        --line: #e5e7eb;
        --cream: #f7f4ee;
        --shadow: 0 14px 38px rgba(22, 50, 79, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          Pretendard,
          "Noto Sans KR",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        background: #fff;
        line-height: 1.65;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .wrap {
        width: min(1060px, calc(100% - 34px));
        margin: auto;
      }
      .top {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(255, 255, 255, 0.96);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(12px);
      }
      .top-inner {
        height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 850;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--navy);
        color: #fff;
      }
      .home {
        font-size: 14px;
        font-weight: 800;
        color: var(--navy);
      }
      .hero {
        padding: 72px 0 60px;
        background: linear-gradient(125deg, var(--navy), var(--blue));
        color: #fff;
      }
      .kicker {
        margin: 0;
        color: var(--gold);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.14em;
      }
      .hero h1 {
        margin: 6px 0 12px;
        font-size: clamp(34px, 6vw, 56px);
        letter-spacing: -0.04em;
      }
      .hero p {
        margin: 0;
        color: #dce6ef;
        font-size: 17px;
      }
      .board {
        padding: 62px 0 88px;
      }
      .board h2 {
        margin: 0 0 24px;
        font-size: 28px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
      }
      .card {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: #fff;
        box-shadow: var(--shadow);
      }
      .thumb {
        position: relative;
        display: block;
        aspect-ratio: 16/9;
        background: #0f172a;
        overflow: hidden;
      }
      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.25s;
      }
      .card:hover .thumb img {
        transform: scale(1.025);
      }
      .play {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: grid;
        place-items: center;
        width: 60px;
        height: 43px;
        padding-left: 3px;
        border-radius: 12px;
        background: #ff0033;
        color: #fff;
        font-size: 20px;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3);
      }
      .duration {
        position: absolute;
        right: 10px;
        bottom: 10px;
        padding: 3px 7px;
        border-radius: 5px;
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        font-size: 12px;
        font-weight: 850;
      }
      .body {
        padding: 22px;
      }
      .body time {
        display: block;
        color: var(--muted);
        font-size: 13px;
      }
      .body h3 {
        margin: 7px 0 4px;
        font-size: 21px;
        line-height: 1.4;
      }
      .body p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }
      .watch {
        display: inline-block;
        margin-top: 16px;
        color: var(--navy);
        font-weight: 900;
      }
      .note {
        margin-top: 32px;
        padding: 20px 22px;
        border-radius: 16px;
        background: var(--cream);
        color: #52606d;
      }
      .footer {
        padding: 38px 0;
        background: #101c2a;
        color: #fff;
      }
      .footer p {
        margin: 5px 0 0;
        color: #b9c5d1;
      }
      @media (max-width: 820px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 600px) {
        .hero {
          padding: 52px 0 46px;
        }
        .board {
          padding: 44px 0 66px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .top-inner {
          height: 62px;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="wrap top-inner">
        <a class="brand" href="../index.html"
          ><span class="mark">✝</span><span>새빛교회</span></a
        ><a class="home" href="../index.html">홈으로</a>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="wrap">
          <p class="kicker">SAEBIT CHURCH SERMON</p>
          <h1>설교</h1>
          <p>예배 가운데 선포된 말씀을 영상으로 다시 만납니다.</p>
        </div>
      </section>
      <section class="board">
        <div class="wrap">
          <h2>최근 설교</h2>
          <div class="grid">
            <article class="card">
              <a
                class="thumb"
                href="https://www.youtube.com/watch?v=ZUGeyPR8HSk"
                target="_blank"
                rel="noopener"
                aria-label="260920 주일 낮 예배 영상 보기"
                ><img
                  src="https://i.ytimg.com/vi/ZUGeyPR8HSk/hqdefault.jpg"
                  alt="260920 주일 낮 예배 유튜브 썸네일"
                /><span class="play" aria-hidden="true">▶</span
                ><span class="duration">24:43</span></a
              >
              <div class="body">
                <time datetime="2026-09-20">2026년 9월 20일 주일 낮 예배</time>
                <h3>그리스도의 몸을 세우는 사람들</h3>
                <p>에베소서 4장 11–13절</p>
                <a
                  class="watch"
                  href="https://www.youtube.com/watch?v=ZUGeyPR8HSk"
                  target="_blank"
                  rel="noopener"
                  >유튜브에서 설교 보기 →</a
                >
              </div>
            </article>
          </div>
          <p class="note">썸네일이나 제목을 누르면 유튜브 영상이 열립니다.</p>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="wrap">
        <strong>기독교대한감리회 새빛교회</strong>
        <p>대전광역시 중구 평촌로 112, 2층</p>
      </div>
    </footer>
  </body>
</html>
